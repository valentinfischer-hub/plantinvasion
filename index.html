<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Plantinvasion 🌿 — Botanik-RPG</title>
    <meta name="description" content="Züchte seltene Pflanzen, kreuze Hybriden und entdecke fünf Biome in diesem cozy Botanik-RPG." />
    <meta name="theme-color" content="#2d3a2a" />
    <!-- FI-Art-UI R1 2026-05-11: Proper Sonnenblumen-SVG-Icon (ersetzt Emoji-Placeholder) -->
    <!-- Skaliert auf alle Grossen (16x16 bis 512x512), distinctive Silhouette -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Fallback: Inline-Emoji fuer aeltere Browser ohne SVG-Favicon-Support -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232d3a2a'/><circle cx='16' cy='16' r='12' fill='none'/><ellipse cx='16' cy='9' rx='2.5' ry='4.5' fill='%23fcd95c'/><ellipse cx='16' cy='23' rx='2.5' ry='4.5' fill='%23fcd95c'/><ellipse cx='9' cy='16' rx='4.5' ry='2.5' fill='%23fcd95c'/><ellipse cx='23' cy='16' rx='4.5' ry='2.5' fill='%23fcd95c'/><ellipse cx='11' cy='11' rx='2.5' ry='4' fill='%23f4a832' transform='rotate(-45 11 11)'/><ellipse cx='21' cy='11' rx='2.5' ry='4' fill='%23f4a832' transform='rotate(45 21 11)'/><ellipse cx='11' cy='21' rx='2.5' ry='4' fill='%23f4a832' transform='rotate(45 11 21)'/><ellipse cx='21' cy='21' rx='2.5' ry='4' fill='%23f4a832' transform='rotate(-45 21 21)'/><circle cx='16' cy='16' r='5.5' fill='%23a05c1a'/><circle cx='16' cy='16' r='4' fill='%235c3210'/></svg>" sizes="32x32" />
    <!-- Apple Touch Icon fuer iOS Homescreen (Safari SVG-Support ab iOS 14.5) -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- PWA-Manifest fuer Add-to-Homescreen und Browser-Branding -->
    <link rel="manifest" href="/manifest.json" />
    <!-- FI-Boot-Time R22: Browser-Preload-Hints fuer kritische Atlas-Assets.
         Der Browser laed diese Dateien sofort beim HTML-Parse, bevor JavaScript startet.
         Wenn Phaser's Loader sie anfragt, sind sie bereits im Cache -> spuerbar kuerzere
         MenuScene.preload()-Phase. Gilt fuer alle Verbindungstypen ausser Offline. -->
    <link rel="preload" href="/assets/atlases/plants_sprint_0.webp" as="image" type="image/webp" />
    <link rel="preload" href="/assets/atlases/plants_sprint_1.webp" as="image" type="image/webp" />
    <link rel="preload" href="/assets/atlases/ground_sprint_1.webp" as="image" type="image/webp" />
    <link rel="preload" href="/assets/atlases/ui_sprint_0.webp" as="image" type="image/webp" />
    <style>
      html, body { margin: 0; padding: 0; background: #1a1a2e; }
      body { display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: system-ui, sans-serif; color: #eee; }
      /* Game container nutzt komplette Viewport-Hoehe und passende Breite je nach Orientierung */
      #game { width: 100vw; height: 100vh; max-height: 100vh; outline: none; display: flex; justify-content: center; align-items: center; }
      #game canvas { outline: none !important; }
      /* Auf sehr breiten Bildschirmen die Canvas-Box etwas einschraenken so dass UI nicht ausserhalb sichtbar wird */
      @media (min-width: 1024px) {
        #game { max-width: 1100px; }
      }
    </style>
  </head>
  <body>
    <div id="game" tabindex="0"></div>
    <script>
      // Auto-Focus auf Game-Container damit Keyboard-Events sofort ankommen
      window.addEventListener('load', () => {
        const el = document.getElementById('game');
        if (el) { el.focus(); el.addEventListener('click', () => el.focus()); }
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
